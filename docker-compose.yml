services:
  api:
    build: .
    container_name: mccoe-cyber-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - dashboard-data:/app/data
      - dashboard-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build: .
    container_name: mccoe-cyber-dashboard
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      USE_API_BACKEND: "true"
      API_BASE_URL: "http://api:8000"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - dashboard-data:/app/data
      - dashboard-db:/app/db
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dashboard-data:
  dashboard-db: