services:
  api:
    build: .
    container_name: mccoe-cyber-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      LOCAL_ONLY: "true"
      AUTO_LOAD_DEMO: "false"
      API_AUTH_ENABLED: "true"
      API_KEY: "mccoe-training-key"
      API_BASIC_USER: "mccoe"
      API_BASIC_PASSWORD: "training"
      INSTRUCTOR_MODE: "false"
      ALLOWED_TARGETS: "127.0.0.1,localhost"
      AUTO_REPORT_ON_UPLOAD: "true"
      MAX_UPLOAD_MB: "50"
    volumes:
      - dashboard-data:/app/data
      - dashboard-db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  dashboard:
    build: .
    container_name: mccoe-cyber-dashboard
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true
    ports:
      - "8501:8501"
    environment:
      LOCAL_ONLY: "true"
      AUTO_LOAD_DEMO: "false"
      USE_API_BACKEND: "true"
      API_BASE_URL: "http://api:8000"
      API_KEY: "mccoe-training-key"
      API_BASIC_USER: "mccoe"
      API_BASIC_PASSWORD: "training"
      INSTRUCTOR_MODE: "false"
      ALLOWED_TARGETS: "127.0.0.1,localhost"
      AUTO_REPORT_ON_UPLOAD: "true"
      MAX_UPLOAD_MB: "50"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - dashboard-data:/app/data
      - dashboard-db:/app/db
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dashboard-data:
  dashboard-db: